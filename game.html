<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра: Найди совпадение</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #334155;
            --accent: #38bdf8;
            --text-color: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 5px;
            color: var(--accent);
            text-align: center;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 90px);
            grid-gap: 12px;
            perspective: 1000px;
        }

        .card {
            width: 90px;
            height: 90px;
            background-color: var(--card-bg);
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.4s ease, background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .card:hover {
            background-color: var(--card-hover);
        }

        .card.flipped, .card.matched {
            transform: rotateY(180deg);
            cursor: default;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 2.2rem;
            user-select: none;
        }

        .card-back {
            background: linear-gradient(135deg, #1e293b, #334155);
            border: 2px solid #475569;
        }

        .card-front {
            background-color: #1e293b;
            border: 2px solid var(--accent);
            transform: rotateY(180deg);
        }

        /* Модальное окно результата */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal-content {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            border: 2px solid var(--accent);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 320px;
            width: 100%;
        }

        .modal-content h2 {
            margin-top: 0;
            color: var(--accent);
        }

        .btn {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <h1>Найди совпадение</h1>
    <div class="stats">
        <div>Ходы: <span id="moves">0</span></div>
        <div>Время: <span id="timer">0</span>с</div>
    </div>

    <div class="game-board" id="gameBoard"></div>

    <!-- Окно результатов -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2>Победа! 🎉</h2>
            <p>Вы успешно нашли все пары.</p>
            <p>Затрачено времени: <strong id="finalTime">0</strong> сек.</p>
            <p>Количество ходов: <strong id="finalMoves">0</strong></p>
            <button class="btn" onclick="startGame()">Играть снова</button>
        </div>
    </div>

    <script>
        const emojis = ['🚀', '🐱', '🍕', '🎸', '⚡', '💎', '🎨', '🚀', '🐱', '🍕', '🎸', '⚡', '💎', '🎨'];
        let board = document.getElementById('gameBoard');
        let movesEl = document.getElementById('moves');
        let timerEl = document.getElementById('timer');
        let modal = document.getElementById('resultModal');
        
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let timer = 0;
        let timerInterval = null;
        let isLocked = false;
        let gameStarted = false;

        // Генерация звуков с помощью Web Audio API (без внешних файлов)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            let now = audioCtx.currentTime;

            if (type === 'flip') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'match') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(120, now + 0.15);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'win') {
                let notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, index) => {
                    let o = audioCtx.createOscillator();
                    let g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.frequency.setValueAtTime(freq, now + index * 0.12);
                    g.gain.setValueAtTime(0.15, now + index * 0.12);
                    g.gain.linearRampToValueAtTime(0.01, now + index * 0.12 + 0.2);
                    o.start(now + index * 0.12);
                    o.stop(now + index * 0.12 + 0.2);
                });
            }
        }

        function startGame() {
            modal.style.display = 'none';
            board.innerHTML = '';
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            timer = 0;
            movesEl.textContent = moves;
            timerEl.textContent = timer;
            isLocked = false;
            gameStarted = false;
            clearInterval(timerInterval);

            // Перемешивание карточек
            let shuffled = [...emojis].sort(() => Math.random() - 0.5);

            shuffled.forEach((emoji) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.emoji = emoji;

                card.innerHTML = `
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front">${emoji}</div>
                `;

                card.addEventListener('click', flipCard);
                board.appendChild(card);
            });
        }

        function flipCard() {
            if (isLocked) return;
            if (this.classList.contains('flipped') || this.classList.contains('matched')) return;

            // Запуск таймера при первом клике
            if (!gameStarted) {
                gameStarted = true;
                timerInterval = setInterval(() => {
                    timer++;
                    timerEl.textContent = timer;
                }, 1000);
            }

            playSound('flip');
            this.classList.add('flipped');
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                moves++;
                movesEl.textContent = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            const match = card1.dataset.emoji === card2.dataset.emoji;

            if (match) {
                playSound('match');
                card1.classList.add('matched');
                card2.classList.add('matched');
                flippedCards = [];
                matchedPairs++;

                // Проверка завершения игры (всего 7 пар)
                if (matchedPairs === emojis.length / 2) {
                    clearInterval(timerInterval);
                    setTimeout(() => {
                        playSound('win');
                        document.getElementById('finalTime').textContent = timer;
                        document.getElementById('finalMoves').textContent = moves;
                        modal.style.display = 'flex';
                    }, 400);
                }
            } else {
                playSound('wrong');
                isLocked = true;
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    isLocked = false;
                }, 800);
            }
        }

        // Первый запуск
        startGame();
    </script>
</body>
</html>
